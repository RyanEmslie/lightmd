<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- LightMD app icon: a Markdown heading mark (#) in front of a warm glow.
       Master for `npx tauri icon src-tauri/icons/icon.svg`. The tile is
       824px with a 100px margin, the macOS icon grid. -->
  <defs>
    <radialGradient id="glow" cx="512" cy="512" r="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="0.45" stop-color="#ffc24b"/>
      <stop offset="0.72" stop-color="#f29a2e"/>
      <stop offset="1" stop-color="#f29a2e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#1b1f2a"/>
  <circle cx="512" cy="512" r="360" fill="url(#glow)"/>
  <g fill="#1b1f2a">
    <rect x="384" y="262" width="78" height="500" rx="39" transform="rotate(12 423 512)"/>
    <rect x="562" y="262" width="78" height="500" rx="39" transform="rotate(12 601 512)"/>
    <rect x="262" y="384" width="500" height="78" rx="39"/>
    <rect x="262" y="562" width="500" height="78" rx="39"/>
  </g>
</svg>

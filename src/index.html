<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LightMD</title>
    <style>
      :root {
        --border: color-mix(in srgb, CanvasText 18%, Canvas);
        --space: 8px;
        --indent: 8px;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: Canvas;
        color: CanvasText;
        font: 13px/1.25 system-ui, sans-serif;
      }

      #shell {
        display: grid;
        grid-template-columns: 240px 1fr 1fr;
        height: 100%;
      }

      .pane {
        position: relative;
        min-width: 160px;
        min-height: 0;
        overflow: hidden;
        padding: 8px 12px;
        box-sizing: border-box;
      }

      .splitter {
        position: absolute;
        top: 0;
        right: 0;
        width: 1px;
        height: 100%;
        background: var(--border);
      }

      #explorer {
        display: flex;
        flex-direction: column;
      }

      #open-folder {
        flex: none;
        align-self: start;
      }

      #explorer-toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        margin-top: 8px;
      }

      #explorer-sort {
        font: inherit;
      }

      #file-list {
        flex: 1;
        min-height: 0;
        overflow: auto;
        list-style: none;
        margin: 8px 0 0;
        padding: 0;
      }

      #file-list ul {
        list-style: none;
        margin: 0;
        padding-left: 8px;
      }

      #file-list details {
        margin: 0;
      }

      #file-list li[data-dir="false"],
      #file-list summary {
        height: 28px;
        line-height: 28px;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }

      #file-list li[data-dir="false"] {
        cursor: pointer;
      }

      #file-list summary {
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        list-style: none;
      }

      #file-list summary::-webkit-details-marker {
        display: none;
      }

      #file-list summary::marker {
        content: none;
      }

      #file-list summary::before {
        content: "▸";
        flex: none;
      }

      #file-list details[open] > summary::before {
        content: "▾";
      }

      #editor {
        display: flex;
        flex-direction: column;
      }

      #editor-buffer {
        flex: 1;
        min-height: 0;
        width: 100%;
        box-sizing: border-box;
        resize: none;
        border: 0;
        padding: 0;
        margin: 0;
        background: transparent;
        color: inherit;
        font: inherit;
      }
    </style>
  </head>
  <body>
    <div id="shell">
      <aside id="explorer" class="pane">
        <button type="button" id="open-folder">Open Folder</button>
        <div id="explorer-toolbar">
          <label for="explorer-sort">Sort</label>
          <select id="explorer-sort">
            <option value="name">Name</option>
            <option value="modified">Modified</option>
          </select>
          <label>
            <input type="checkbox" id="show-extensions" checked />
            Extensions
          </label>
        </div>
        <ul id="file-list"></ul>
        <div class="splitter" role="separator" aria-orientation="vertical"></div>
      </aside>
      <main id="editor" class="pane">
        <textarea id="editor-buffer"></textarea>
        <div class="splitter" role="separator" aria-orientation="vertical"></div>
      </main>
      <section id="preview" class="pane">Preview</section>
    </div>
    <script>
      (function () {
        const button = document.getElementById("open-folder");
        const fileList = document.getElementById("file-list");
        const buffer = document.getElementById("editor-buffer");
        const sortSelect = document.getElementById("explorer-sort");
        const extensionsToggle = document.getElementById("show-extensions");
        let workspacePath = null;
        let lastEntries = [];

        function folderPath(selected) {
          if (!selected) return null;
          if (Array.isArray(selected)) return folderPath(selected[0]);
          if (typeof selected === "string") return selected;
          if (typeof selected.path === "string") return selected.path;
          return null;
        }

        function displayName(name, isDir) {
          if (extensionsToggle.checked || isDir) return name;
          const dot = name.lastIndexOf(".");
          if (dot <= 0) return name;
          return name.slice(0, dot);
        }

        function treeFrom(entries) {
          const root = { children: [] };
          const nodes = new Map();
          nodes.set("", root);

          for (const entry of entries) {
            const parts = entry.relative_path.split("/");
            const node = {
              name: parts[parts.length - 1],
              path: entry.relative_path,
              is_dir: entry.is_dir,
              children: [],
            };
            nodes.set(entry.relative_path, node);
          }

          for (const entry of entries) {
            const parts = entry.relative_path.split("/");
            const parentPath = parts.slice(0, -1).join("/");
            const parent = nodes.get(parentPath) || root;
            parent.children.push(nodes.get(entry.relative_path));
          }
          return root;
        }

        function appendNode(node, list) {
          const item = document.createElement("li");
          item.dataset.path = node.path;
          item.dataset.dir = node.is_dir ? "true" : "false";
          if (node.is_dir) {
            const details = document.createElement("details");
            const summary = document.createElement("summary");
            summary.textContent = displayName(node.name, true);
            details.appendChild(summary);
            const nested = document.createElement("ul");
            for (const child of node.children) {
              appendNode(child, nested);
            }
            details.appendChild(nested);
            item.appendChild(details);
          } else {
            item.textContent = displayName(node.name, false);
          }
          list.appendChild(item);
        }

        function render(entries) {
          fileList.replaceChildren();
          const tree = treeFrom(entries);
          for (const child of tree.children) {
            appendNode(child, fileList);
          }
        }

        async function pickFolder() {
          const tauri = window.__TAURI__;
          if (!tauri) return null;
          if (tauri.dialog && typeof tauri.dialog.open === "function") {
            return tauri.dialog.open({ directory: true, multiple: false });
          }
          return tauri.core.invoke("plugin:dialog|open", {
            options: { directory: true, multiple: false },
          });
        }

        async function loadWorkspace(path) {
          const entries = await window.__TAURI__.core.invoke("list_workspace", {
            path,
            sort: sortSelect.value,
          });
          lastEntries = entries;
          render(entries);
        }

        button.addEventListener("click", async () => {
          const selected = await pickFolder();
          const path = folderPath(selected);
          if (!path) return;
          workspacePath = path;
          await loadWorkspace(path);
        });

        sortSelect.addEventListener("change", async () => {
          if (!workspacePath) return;
          await loadWorkspace(workspacePath);
        });

        extensionsToggle.addEventListener("change", () => {
          render(lastEntries);
        });

        fileList.addEventListener("click", async (event) => {
          const item = event.target.closest("li");
          if (!item || !fileList.contains(item)) return;
          if (item.dataset.dir === "true") return;
          if (!workspacePath) return;
          const relative = item.dataset.path;
          const body = await window.__TAURI__.core.invoke("read_workspace_file", {
            path: workspacePath,
            relative,
          });
          buffer.value = body;
        });
      })();
    </script>
  </body>
</html>

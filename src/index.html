<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LightMD</title>
    <style>
      :root {
        --border: color-mix(in srgb, CanvasText 18%, Canvas);
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: Canvas;
        color: CanvasText;
        font: 13px/1.25 system-ui, sans-serif;
      }

      #shell {
        display: grid;
        grid-template-columns: 240px 1fr 1fr;
        height: 100%;
      }

      .pane {
        position: relative;
        min-width: 160px;
        min-height: 0;
        overflow: hidden;
        padding: 8px 12px;
        box-sizing: border-box;
      }

      .splitter {
        position: absolute;
        top: 0;
        right: 0;
        width: 1px;
        height: 100%;
        background: var(--border);
      }

      #explorer {
        display: flex;
        flex-direction: column;
      }

      #open-folder {
        flex: none;
        align-self: start;
      }

      #file-list {
        flex: 1;
        min-height: 0;
        overflow: auto;
        list-style: none;
        margin: 8px 0 0;
        padding: 0;
      }

      #file-list li[data-dir="false"] {
        cursor: pointer;
      }

      #editor {
        display: flex;
        flex-direction: column;
      }

      #editor-buffer {
        flex: 1;
        min-height: 0;
        width: 100%;
        box-sizing: border-box;
        resize: none;
        border: 0;
        padding: 0;
        margin: 0;
        background: transparent;
        color: inherit;
        font: inherit;
      }
    </style>
  </head>
  <body>
    <div id="shell">
      <aside id="explorer" class="pane">
        <button type="button" id="open-folder">Open Folder</button>
        <ul id="file-list"></ul>
        <div class="splitter" role="separator" aria-orientation="vertical"></div>
      </aside>
      <main id="editor" class="pane">
        <textarea id="editor-buffer"></textarea>
        <div class="splitter" role="separator" aria-orientation="vertical"></div>
      </main>
      <section id="preview" class="pane">Preview</section>
    </div>
    <script>
      (function () {
        const button = document.getElementById("open-folder");
        const fileList = document.getElementById("file-list");
        const buffer = document.getElementById("editor-buffer");
        let workspacePath = null;

        function folderPath(selected) {
          if (!selected) return null;
          if (Array.isArray(selected)) return folderPath(selected[0]);
          if (typeof selected === "string") return selected;
          if (typeof selected.path === "string") return selected.path;
          return null;
        }

        function render(entries) {
          fileList.replaceChildren();
          for (const entry of entries) {
            const item = document.createElement("li");
            item.textContent = entry.relative_path;
            item.dataset.path = entry.relative_path;
            item.dataset.dir = entry.is_dir ? "true" : "false";
            fileList.appendChild(item);
          }
        }

        async function pickFolder() {
          const tauri = window.__TAURI__;
          if (!tauri) return null;
          if (tauri.dialog && typeof tauri.dialog.open === "function") {
            return tauri.dialog.open({ directory: true, multiple: false });
          }
          return tauri.core.invoke("plugin:dialog|open", {
            options: { directory: true, multiple: false },
          });
        }

        button.addEventListener("click", async () => {
          const selected = await pickFolder();
          const path = folderPath(selected);
          if (!path) return;
          workspacePath = path;
          const entries = await window.__TAURI__.core.invoke("list_workspace", {
            path,
          });
          render(entries);
        });

        fileList.addEventListener("click", async (event) => {
          const item = event.target.closest("li");
          if (!item || !fileList.contains(item)) return;
          if (item.dataset.dir === "true") return;
          if (!workspacePath) return;
          const relative = item.dataset.path;
          const body = await window.__TAURI__.core.invoke("read_workspace_file", {
            path: workspacePath,
            relative,
          });
          buffer.value = body;
        });
      })();
    </script>
  </body>
</html>

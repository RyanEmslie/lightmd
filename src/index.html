<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LightMD</title>
    <style>
      :root {
        --bg: #1e1e1e;
        --bg-elevated: #252526;
        --fg: #d4d4d4;
        --fg-muted: #9d9d9d;
        --border: #3c3c3c;
        --accent: #007acc;
        --danger: #f48771;
        --space: 8px;
        --indent: 8px;
        color-scheme: dark;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font: 13px/1.25 system-ui, sans-serif;
      }

      #settings,
      .settings {
        font: 13px/1.25 system-ui, sans-serif;
      }

      button,
      input,
      select {
        border-radius: 4px;
      }

      body {
        display: flex;
        flex-direction: column;
      }

      :focus-visible {
        outline: 2px solid var(--accent);
      }

      ::selection {
        background: var(--accent);
      }

      #shell {
        display: grid;
        grid-template-columns: 240px 1fr 1fr;
        flex: 1;
        min-height: 0;
        transition: grid-template-columns 120ms;
      }

      .pane {
        position: relative;
        min-width: 160px;
        min-height: 0;
        overflow: hidden;
        padding: 8px 12px;
        box-sizing: border-box;
      }

      .pane.collapsed {
        min-width: 0;
        width: 0;
        padding: 0;
      }

      .splitter {
        position: absolute;
        top: 0;
        right: 0;
        width: 1px;
        height: 100%;
        background: var(--border);
      }

      #explorer {
        display: flex;
        flex-direction: column;
        background: var(--bg);
        color: var(--fg);
      }

      #open-folder {
        flex: none;
        align-self: start;
      }

      #explorer-toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        margin-top: 8px;
      }

      #explorer-sort,
      #editor-theme,
      #preview-theme {
        font: inherit;
      }

      #editor-theme,
      #preview-theme {
        color: var(--fg);
        background: var(--bg-elevated);
        border: 1px solid var(--border);
      }

      #file-list {
        flex: 1;
        min-height: 0;
        overflow: auto;
        list-style: none;
        margin: 8px 0 0;
        padding: 0;
      }

      #file-list ul {
        list-style: none;
        margin: 0;
        padding-left: 8px;
      }

      #file-list details {
        margin: 0;
      }

      #file-list li[data-dir="false"],
      #file-list summary {
        height: 28px;
        line-height: 28px;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }

      #file-list li[data-dir="false"] {
        cursor: pointer;
      }

      #file-list summary {
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        list-style: none;
      }

      #file-list summary::-webkit-details-marker {
        display: none;
      }

      #file-list summary::marker {
        content: none;
      }

      #file-list summary::before {
        content: "▸";
        flex: none;
      }

      #file-list details[open] > summary::before {
        content: "▾";
      }

      #editor,
      #preview {
        display: flex;
        flex-direction: column;
        background: var(--bg);
        color: var(--fg);
      }

      #editor-chrome,
      #preview-chrome {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        flex: none;
        margin: 0 0 8px;
      }

      #dirty {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent);
      }

      #dirty[hidden] {
        display: none;
      }

      #status-strip {
        display: flex;
        align-items: center;
        gap: 8px;
        flex: none;
        height: 24px;
        padding: 0 12px;
        box-sizing: border-box;
        border-top: 1px solid var(--border);
        background: var(--bg-elevated);
        color: var(--fg-muted);
        overflow: hidden;
      }

      #status-path {
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        min-width: 0;
        flex: 1;
      }

      #word-count {
        flex: none;
        margin-left: auto;
      }

      #find-query {
        font: inherit;
        min-width: 10em;
        flex: 1 1 8em;
        max-width: 20em;
      }

      #frontmatter {
        flex: none;
        display: flex;
        flex-wrap: wrap;
        gap: 8px 16px;
        margin: 0 0 8px;
        padding: 0 0 8px;
        border-bottom: 1px solid var(--border);
        background: var(--bg-elevated);
        font-size: 12px;
        line-height: 1.25;
      }

      #frontmatter .fm-val {
        color: var(--fg-muted);
      }

      #frontmatter[hidden] {
        display: none;
      }

      #frontmatter .fm-key {
        font-weight: 600;
        margin-right: 8px;
      }

      #preview-body {
        flex: 1;
        min-height: 0;
        overflow: auto;
        font-family: system-ui, sans-serif;
        font-size: 16px;
        line-height: 1.55;
        max-width: 72ch;
      }

      #preview-body table {
        border-collapse: collapse;
      }

      #preview-body th,
      #preview-body td {
        border: 1px solid var(--border);
        padding: 4px 8px;
      }

      #preview-body img {
        max-width: 100%;
      }

      #preview-body pre {
        overflow: auto;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }

      #preview-body[hidden] {
        display: none;
      }

      #html-viewer {
        flex: 1;
        min-height: 0;
        width: 100%;
        border: 0;
        background: var(--bg);
      }

      #html-viewer[hidden] {
        display: none;
      }

      #html-js-chrome {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        flex: none;
        margin: 0 0 8px;
      }

      #html-js-chrome[hidden] {
        display: none;
      }

      #html-js-warn {
        margin: 0;
        color: var(--danger);
      }

      #html-js-warn[hidden] {
        display: none;
      }

      #editor-buffer {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
        resize: none;
      }

      #editor-view {
        flex: 1;
        min-height: 0;
        width: 100%;
        overflow: hidden;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 14px;
        line-height: 1.45;
      }

      #editor-view .cm-editor {
        height: 100%;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 14px;
        line-height: 1.45;
      }
    </style>
  </head>
  <body>
    <div id="shell">
      <aside id="explorer" class="pane">
        <button type="button" id="open-folder">Open Folder</button>
        <div id="explorer-toolbar">
          <button type="button" data-pane-toggle="explorer" aria-pressed="true">Hide</button>
          <label for="explorer-sort">Sort</label>
          <select id="explorer-sort">
            <option value="name">Name</option>
            <option value="modified">Modified</option>
          </select>
          <label>
            <input type="checkbox" id="show-extensions" checked />
            Extensions
          </label>
        </div>
        <ul id="file-list"></ul>
        <div class="splitter" role="separator" aria-orientation="vertical"></div>
      </aside>
      <main id="editor" class="pane">
        <textarea id="editor-buffer"></textarea>
        <div id="editor-chrome">
          <button type="button" data-pane-toggle="editor" aria-pressed="true">Hide</button>
          <button type="button" id="save">Save</button>
          <button type="button" id="find">Find</button>
          <input type="search" id="find-query" placeholder="Find in file" autocomplete="off" />
          <label for="pane-layout">Layout</label>
          <select id="pane-layout">
            <option value="three-pane" selected>Three panes</option>
            <option value="editor-only">Editor only</option>
            <option value="reader-only">Reader only</option>
          </select>
          <label for="editor-theme">Editor theme</label>
          <select id="editor-theme">
            <option>Light</option>
            <option>Dark</option>
            <option>High Contrast Light</option>
            <option>High Contrast Dark</option>
            <option selected>Dark+</option>
            <option>Solarized Light</option>
            <option>Solarized Dark</option>
            <option>Monokai</option>
          </select>
        </div>
        <div id="frontmatter" hidden></div>
        <div id="editor-view"></div>
        <div class="splitter" role="separator" aria-orientation="vertical"></div>
      </main>
      <section id="preview" class="pane">
        <div id="preview-chrome">
          <button type="button" data-pane-toggle="preview" aria-pressed="true">Hide</button>
          <label for="preview-theme">Preview theme</label>
          <select id="preview-theme">
            <option>Light</option>
            <option selected>Dark</option>
            <option>High Contrast Light</option>
            <option>High Contrast Dark</option>
            <option>Dark+</option>
            <option>Solarized Light</option>
            <option>Solarized Dark</option>
            <option>Monokai</option>
          </select>
        </div>
        <div id="html-js-chrome" hidden>
          <label>
            <input type="checkbox" id="html-js" />
            Enable JavaScript
          </label>
          <p id="html-js-warn" role="alert" hidden>
            Warning: JavaScript is on
          </p>
        </div>
        <div id="preview-body">Preview</div>
        <iframe id="html-viewer" sandbox hidden></iframe>
      </section>
    </div>
    <footer id="status-strip">
      <span id="status-path"></span>
      <span id="dirty" hidden></span>
      <span id="word-count"></span>
    </footer>
    <script>
      (function () {
        const button = document.getElementById("open-folder");
        const saveButton = document.getElementById("save");
        const dirtyDot = document.getElementById("dirty");
        const statusPath = document.getElementById("status-path");
        const fileList = document.getElementById("file-list");
        const buffer = document.getElementById("editor-buffer");
        const sortSelect = document.getElementById("explorer-sort");
        const extensionsToggle = document.getElementById("show-extensions");
        let workspacePath = null;
        let lastEntries = [];
        let currentRelative = null;
        let dirty = false;

        function setDirty(value) {
          dirty = value;
          if (dirtyDot) dirtyDot.hidden = !dirty;
          if (!value && typeof window.lightmdCancelAutosave === "function") {
            window.lightmdCancelAutosave();
          }
        }

        window.lightmdSetDirty = setDirty;
        Object.defineProperty(window, "lightmdWorkspace", {
          get() {
            return {
              path: workspacePath,
              relative: currentRelative,
              contents: buffer.value,
            };
          },
        });

        function folderPath(selected) {
          if (!selected) return null;
          if (Array.isArray(selected)) return folderPath(selected[0]);
          if (typeof selected === "string") return selected;
          if (typeof selected.path === "string") return selected.path;
          return null;
        }

        function displayName(name, isDir) {
          if (extensionsToggle.checked || isDir) return name;
          const dot = name.lastIndexOf(".");
          if (dot <= 0) return name;
          return name.slice(0, dot);
        }

        function treeFrom(entries) {
          const root = { children: [] };
          const nodes = new Map();
          nodes.set("", root);

          for (const entry of entries) {
            const parts = entry.relative_path.split("/");
            const node = {
              name: parts[parts.length - 1],
              path: entry.relative_path,
              is_dir: entry.is_dir,
              children: [],
            };
            nodes.set(entry.relative_path, node);
          }

          for (const entry of entries) {
            const parts = entry.relative_path.split("/");
            const parentPath = parts.slice(0, -1).join("/");
            const parent = nodes.get(parentPath) || root;
            parent.children.push(nodes.get(entry.relative_path));
          }
          return root;
        }

        function appendNode(node, list) {
          const item = document.createElement("li");
          item.dataset.path = node.path;
          item.dataset.dir = node.is_dir ? "true" : "false";
          if (node.is_dir) {
            const details = document.createElement("details");
            const summary = document.createElement("summary");
            summary.textContent = displayName(node.name, true);
            details.appendChild(summary);
            const nested = document.createElement("ul");
            for (const child of node.children) {
              appendNode(child, nested);
            }
            details.appendChild(nested);
            item.appendChild(details);
          } else {
            item.textContent = displayName(node.name, false);
          }
          list.appendChild(item);
        }

        function render(entries) {
          fileList.replaceChildren();
          const tree = treeFrom(entries);
          for (const child of tree.children) {
            appendNode(child, fileList);
          }
        }

        async function pickFolder() {
          const tauri = window.__TAURI__;
          if (!tauri) return null;
          if (tauri.dialog && typeof tauri.dialog.open === "function") {
            return tauri.dialog.open({ directory: true, multiple: false });
          }
          return tauri.core.invoke("plugin:dialog|open", {
            options: { directory: true, multiple: false },
          });
        }

        async function loadWorkspace(path) {
          const entries = await window.__TAURI__.core.invoke("list_workspace", {
            path,
            sort: sortSelect.value,
          });
          lastEntries = entries;
          render(entries);
        }

        button.addEventListener("click", async () => {
          const selected = await pickFolder();
          const path = folderPath(selected);
          if (!path) return;
          workspacePath = path;
          await loadWorkspace(path);
        });

        sortSelect.addEventListener("change", async () => {
          if (!workspacePath) return;
          await loadWorkspace(workspacePath);
        });

        extensionsToggle.addEventListener("change", () => {
          render(lastEntries);
        });

        fileList.addEventListener("click", async (event) => {
          const item = event.target.closest("li");
          if (!item || !fileList.contains(item)) return;
          if (item.dataset.dir === "true") return;
          if (!workspacePath) return;
          if (typeof window.lightmdCancelAutosave === "function") {
            window.lightmdCancelAutosave();
          }
          const relative = item.dataset.path;
          const body = await window.__TAURI__.core.invoke("read_workspace_file", {
            path: workspacePath,
            relative,
          });
          currentRelative = relative;
          if (statusPath) statusPath.textContent = currentRelative;
          buffer.value = body;
          if (window.lightmdEditor) {
            window.lightmdEditor.setDoc(body);
          }
          setDirty(false);
        });

        saveButton.addEventListener("click", async () => {
          if (!workspacePath || !currentRelative) return;
          const tauri = window.__TAURI__;
          if (!tauri) return;
          await tauri.core.invoke("write_workspace_file", {
            path: workspacePath,
            relative: currentRelative,
            contents: buffer.value,
          });
          setDirty(false);
        });

        buffer.addEventListener("input", () => {
          setDirty(true);
          if (typeof window.lightmdScheduleAutoSave === "function") {
            window.lightmdScheduleAutoSave();
          }
        });
      })();
    </script>
    <script src="./editor.bundle.js"></script>
  </body>
</html>
